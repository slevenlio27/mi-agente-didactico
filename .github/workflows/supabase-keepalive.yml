# Evita que Supabase pause el proyecto gratuito por inactividad (se pausa tras 7 días
# sin actividad en la base de datos). Hace una consulta mínima cada 3 días.
#
# Configuración (una sola vez): en GitHub, tu repositorio > Settings > Secrets and
# variables > Actions > New repository secret:
#   Nombre: SUPABASE_DB_URL
#   Valor:  la misma cadena de conexión de DATABASE_URL (Session pooler), con tu contraseña.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 */3 * *"   # cada 3 días a las 12:00 UTC
  workflow_dispatch: {}      # también se puede ejecutar a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a la base de datos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Falta el secreto SUPABASE_DB_URL (ver instrucciones al inicio de este archivo)."
            exit 1
          fi
          sudo apt-get install -y -qq postgresql-client > /dev/null
          # psql no entiende el prefijo +psycopg del proyecto; se quita si estuviera
          psql "${DB_URL/+psycopg/}" -c "SELECT 1;" > /dev/null
          echo "Base de datos activa."
